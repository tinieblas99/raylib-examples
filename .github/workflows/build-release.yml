name: Build Raylib Libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build-linux:
    name: Linux (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash scripts/install-deps-linux.sh

      - name: Clone sources
        run: bash scripts/setup.sh

      - name: Build
        run: bash scripts/build-linux.sh ${{ github.workspace }}/../raylib-install

      - name: Package
        run: tar -czf raylib-linux.tar.gz -C ${{ github.workspace }}/../raylib-install .

      - uses: actions/upload-artifact@v4
        with:
          name: raylib-linux
          path: raylib-linux.tar.gz

  build-windows:
    name: Windows x86_64 (mingw cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          bash scripts/install-deps-linux.sh
          sudo apt-get install -y mingw-w64

      - name: Clone sources
        run: bash scripts/setup.sh

      - name: Build
        run: bash scripts/build-windows.sh ${{ github.workspace }}/../raylib-win64

      - name: Package
        run: tar -czf raylib-win64.tar.gz -C ${{ github.workspace }}/../raylib-win64 .

      - uses: actions/upload-artifact@v4
        with:
          name: raylib-win64
          path: raylib-win64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Raylib Libraries ${{ github.event.inputs.tag }}
          files: |
            raylib-linux.tar.gz
            raylib-win64.tar.gz
